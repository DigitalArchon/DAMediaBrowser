[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mediabrowser"
version = "0.24.0"
description = "Browse, name and play the chapters of video files and Blu-ray discs."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Digital Archon" }]
requires-python = ">=3.11"
# Everything else this app needs is an external binary, not a Python package:
# ffmpeg/ffprobe, mpv, and (optionally) libbluray. See mediabrowser.core.depcheck.
dependencies = [
    "PySide6-Essentials>=6.6",
    # The Nano-GPT key's home: the Secret Service (core/creds.py).
    "keyring>=25",
    # The TEE checks verify Intel's and NVIDIA's signatures with it (core/dcap.py,
    # nras.py), and keyring's SecretStorage opens its session with it: a floor for a
    # source install, at what the AppImage ships (packaging/appimage/requirements.txt).
    "cryptography>=50.0.2",
]

[project.urls]
Homepage = "https://github.com/DigitalArchon/DAMediaBrowser"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
mediabrowser = "mediabrowser.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mediabrowser*"]

[tool.setuptools.package-data]
mediabrowser = ["gui/*.qss"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Build output holds an extracted CPython and Qt; ruff honours .gitignore
# only inside a git repository, so it is named here too.
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Privacy Mode's verifiers and sealed client are kept line for line with the
# copies in DA Assistant and the other apps that share them, so a fix in one
# can be carried to the others as a diff; their style is those apps'.
"mediabrowser/core/{dcap,nras,ethsig,private_ai,sealed}.py" = ["B904", "B905", "UP017"]
# dcap.py, nras.py and sdk_guard.py are DA Toolkit's and SealedLore's copies line for
# line (tests/test_shared_code.py), formatted as theirs are: to 120 columns, as
# SealedLore exempts them too.
"mediabrowser/core/{dcap,nras,sdk_guard}.py" = ["E501"]
# It lists other files' lines word for word, as the differences it allows.
"tests/test_shared_code.py" = ["E501"]
# DA Assistant's copy (tests/test_recent_files.py holds it to that one), in its style: its
# zip()s pair lists of one length.
"mediabrowser/gui/recentguard.py" = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import each other's helpers as tests.*, which needs the
# checkout on the path - there with python -m pytest, not with plain pytest.
pythonpath = ["."]
